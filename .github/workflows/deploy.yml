name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    
    - name: Run tests
      run: go test -count=1 ./src/tests/
    
    - name: Build and push Docker image
      uses: docker/setup-buildx-action@v2
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Build and push to Container Registry
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/pricing-engine
    
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy pricing-engine \
          --image gcr.io/${{ secrets.GCP_PROJECT }}/pricing-engine \
          --region asia-southeast1 \
          --platform managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=100 \
          --set-env-vars="ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }},READ_ONLY_API_KEY=${{ secrets.READ_ONLY_API_KEY }},HMAC_SECRET=${{ secrets.HMAC_SECRET }},DATABASE_URL=${{ secrets.DATABASE_URL }}" \
          --quiet
