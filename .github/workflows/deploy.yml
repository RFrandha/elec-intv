name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Run tests
      run: go test -count=1 ./src/tests/

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/599858649457/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-deployer@electrum-pricing.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and push to Artifact Registry
      run: |
        gcloud builds submit --tag \
          asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/pricing-engine-repo/pricing-engine

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy pricing-engine \
          --image "asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/pricing-engine-repo/pricing-engine" \
          --region=asia-southeast1 \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=100 \
          --concurrency=80 \
          --cpu=1 \
          --memory=512Mi \
          --timeout=60s \
          --add-cloudsql-instances="${{ secrets.GCP_PROJECT }}:asia-southeast1:${{ secrets.DB_INSTANCE }}" \
          --set-env-vars="ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }},READ_ONLY_API_KEY=${{ secrets.READ_ONLY_API_KEY }},HMAC_SECRET=${{ secrets.HMAC_SECRET }},DATABASE_URL=${{ secrets.DATABASE_URL }}"
