services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: electrum_pricing
      POSTGRES_USER: electrum
      POSTGRES_PASSWORD: electrum_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electrum -d electrum_pricing"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://electrum:electrum_pass@db:5432/electrum_pricing?sslmode=disable
      ADMIN_API_KEY: admin-secure-key-5678
      READ_ONLY_API_KEY: demo-read-only-1234
      HMAC_SECRET: audit-hmac-secret-9012
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
